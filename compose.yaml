services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: content_hub
      POSTGRES_DB: content_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hex POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U content_hub -d content_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://content_hub:${POSTGRES_PASSWORD}@db:5432/content_hub
      DATA_DIR: /app/.data
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - content_data:/app/.data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
  content_data:
