services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: content_hub
      POSTGRES_DB: content_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hex POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U content_hub -d content_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Initialize OWNER_PASSWORD_HASH with npm run setup}
      DATABASE_URL: postgres://content_hub:${POSTGRES_PASSWORD}@db:5432/content_hub
      DATA_DIR: /app/.data
      HUB_MIGRATIONS: ${HUB_MIGRATIONS:-auto}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      OAUTH_CLIENTS_JSON: ${OAUTH_CLIENTS_JSON:-[]}
      NODE_ENV: production
      HUB_HOST: 0.0.0.0
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - content_data:/app/.data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
  content_data:
