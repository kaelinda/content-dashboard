name: Build development runtime
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/runtime-cache.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit
      - name: Package public dependencies for isolated validation
        run: tar -czf /tmp/content-hub-runtime.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: development-runtime
          path: /tmp/content-hub-runtime.tar.gz
          retention-days: 1
