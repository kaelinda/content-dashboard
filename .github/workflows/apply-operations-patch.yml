name: Apply reviewed operations hardening
on:
  push:
    branches: ['fix/operations-hardening-v1-2-1']
    paths: ['.github/workflows/apply-operations-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operations-hardening-v1-2-1
      - name: Verify transfer and apply reviewed source
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          files = [Path(f'.bootstrap/operations-{i:02d}.b64') for i in range(3)]
          encoded = ''.join(p.read_text() for p in files)
          assert len(encoded) == 38184, 'Unexpected transfer length'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '53347865fee3273198955920e07dbbe96930c2a249f7990e21899611c1b53737', 'Patch digest mismatch'
          path = Path('/tmp/operations.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          for p in files:
              p.unlink()
          subprocess.run(['git', 'add', '-u', '.bootstrap'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed and all(not p.startswith(('migrations/', '.github/workflows/')) for p in changed), 'Immutable migration or workflow changed'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit application changes only
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add private Hub operations diagnostics and recovery controls'
          git push origin HEAD:fix/operations-hardening-v1-2-1
