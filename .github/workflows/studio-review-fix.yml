name: Apply Studio screenshot review
on:
  push:
    branches: ['feat/sage-studio-ui-v1-2']
    paths: ['.github/workflows/studio-review-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sage-studio-ui-v1-2
      - name: Apply exact reviewed changes
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'src/app/studio.css': 'e061c092ca098f4ed6245722670fdb078a727989',
              'src/components/studio/overview.tsx': '474104f28337f172779ed1895876372dde85a3a8',
              'tests/e2e/studio.spec.ts': 'ea255f9e8b2c90e4028b6a34c4b0d2f6d87be5f8',
              '.github/workflows/verify.yml': 'e4146d7865f670817a4ccd22e9e6b84a65a65d1b',
          }
          bodies = {}
          for name, sha in expected.items():
              raw = Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha, name
              bodies[name] = raw.decode()
          def replace(name, before, after):
              assert bodies[name].count(before) == 1, (name, before)
              bodies[name] = bodies[name].replace(before, after)
          replace('src/app/studio.css', '.studio-table {\n', '.studio-table {\n  min-width: 0;\n')
          replace('src/components/studio/overview.tsx', '已选 Agent 的能力', '授权能力预览')
          replace('tests/e2e/studio.spec.ts', 'expect(page.getByRole("alert")).toContainText("暂时不可用")', 'expect(detail.getByRole("alert")).toContainText("暂时不可用")')
          before = '  expect(loginResponse.ok()).toBe(true);\n'
          after = '''  expect(loginResponse.ok()).toBe(true);
            // A failed case restarts its Playwright worker, not the application.
            // Reuse the complete fixture graph instead of duplicating prior writes.
            const snapshotResponse = await request.get("/api/hub");
            expect(snapshotResponse.ok()).toBe(true);
            const snapshot = await snapshotResponse.json() as {
              contents: { id: string; title: string }[];
              sources: { id: string; title: string }[];
              artifacts: { id: string; variant: string }[];
            };
            if (snapshot.contents.length) {
              contentIds = titles.map(title => snapshot.contents.find(c => c.title === title)?.id ?? "");
              sourceIds = ["示例 · Agent 接入规范", "示例 · 团队知识整理笔记", "示例 · 版本与追溯设计", "示例 · 发布流程检查表", "示例 · 开放接口参考", "示例 · 资料复用实践"].map(title => snapshot.sources.find(s => s.title === title)?.id ?? "");
              selectedHtmlId = snapshot.artifacts.find(a => a.variant === "studio-demo")?.id ?? "";
              expect(contentIds.every(Boolean) && sourceIds.every(Boolean) && !!selectedHtmlId, "Complete isolated Studio fixture must be reusable").toBe(true);
              expect(snapshot.contents).toHaveLength(6);
              return;
            }
          '''
          replace('tests/e2e/studio.spec.ts', before, after)
          before = '  await page.locator(".studio-agent-table .studio-identity").first().click();'
          after = '''  const tableBounds = await page.locator(".studio-agent-table").evaluate(table => {
              const container = table.parentElement!;
              return { table: table.getBoundingClientRect().width, container: container.clientWidth, overflow: container.scrollWidth - container.clientWidth };
            });
            expect(tableBounds.table).toBeLessThanOrEqual(tableBounds.container + 1);
            expect(tableBounds.overflow).toBeLessThanOrEqual(1);
            await page.locator(".studio-agent-table .studio-identity").first().click();'''
          replace('tests/e2e/studio.spec.ts', before, after)
          replace('.github/workflows/verify.yml', '      - run: npx playwright install --with-deps chromium\n', '      - run: npx playwright install --with-deps chromium\n      - name: Install system CJK fonts for faithful Chinese UI screenshots\n        run: sudo apt-get install --no-install-recommends -y fonts-noto-cjk\n')
          for name, body in bodies.items():
              Path(name).write_text(body)
          Path('.github/workflows/studio-review-fix.yml').unlink()
          PY
      - name: Format changed application and test source
        run: npx --yes prettier@3.6.2 --write src/app/studio.css src/components/studio/overview.tsx tests/e2e/studio.spec.ts
      - name: Commit reviewed fixes
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/studio.css src/components/studio/overview.tsx tests/e2e/studio.spec.ts .github/workflows/verify.yml .github/workflows/studio-review-fix.yml
          git commit -m 'fix: fit Studio tables to cards and verify usable mobile actions'
          git push origin HEAD:feat/sage-studio-ui-v1-2
