name: Finalize Agent Hub acceptance
on:
  push:
    branches: ['feat/agent-gateway-v1-1']
    paths: ['.github/workflows/agent-upgrade.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-gateway-v1-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrowly scoped acceptance corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('src/components/agent-console.tsx')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='c3ead4dcd409dcb3ab6aac2f0bb03b6f33a32c5a'
          body=raw.decode()
          old='<select onChange={(e) => setScopes(presets[e.target.value])}>'
          assert body.count(old)==1
          body=body.replace(old, '''<select
            value={Object.keys(presets).find(k => presets[k].length === scopes.length && presets[k].every(s => scopes.includes(s))) ?? "custom"}
            onChange={(e) => { if (presets[e.target.value]) setScopes(presets[e.target.value]); }}
          >
            <option value="custom" disabled>自定义权限</option>''')
          p.write_text(body)
          p=Path('package.json');data=json.loads(p.read_text());assert data['scripts']['test:e2e']=='playwright test';data['scripts']['test:e2e']='node scripts/test-browser.mjs';p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          p=Path('scripts/test-browser.mjs');assert not p.exists()
          p.write_text('''import { spawnSync } from "node:child_process";
          import { resolve } from "node:path";
          // Each workflow family gets an independent database and report directory.
          // Run both families even if one fails; never turn a failing suite green.
          const suites = [
            ["core", "tests/e2e/workspace.spec.ts"],
            ["agents", "tests/e2e/agent-workflow.spec.ts"],
          ];
          let failed = false;
          for (const [name, file] of suites) {
            const result = spawnSync(process.execPath, [
              resolve("node_modules/@playwright/test/cli.js"), "test", file,
              "--output=test-results/" + name, ...process.argv.slice(2),
            ], {
              stdio: "inherit",
              env: { ...process.env, E2E_DATA_DIR: ".data-e2e/" + name,
                PLAYWRIGHT_HTML_OUTPUT_DIR: "playwright-report/" + name },
            });
            if (result.error) console.error(result.error.message);
            if (result.status !== 0) failed = true;
          }
          process.exitCode = failed ? 1 : 0;
          ''')
          p=Path('playwright.config.ts');body=p.read_text();assert body.count('DATA_DIR: ".data-e2e",')==1;body=body.replace('DATA_DIR: ".data-e2e",','DATA_DIR: process.env.E2E_DATA_DIR || ".data-e2e",');p.write_text(body)
          p=Path('tests/e2e/setup.ts');body=p.read_text();assert 'process.env.DATA_DIR !== ".data-e2e"' in body;body=body.replace('process.env.DATA_DIR !== ".data-e2e"','![".data-e2e", ".data-e2e/core", ".data-e2e/agents"].includes(process.env.DATA_DIR || "")');body=body.replace('rm(".data-e2e",','rm(process.env.DATA_DIR!,');p.write_text(body)
          p=Path('tests/e2e/agent-workflow.spec.ts');body=p.read_text()
          # A grant preset must not misrepresent manual checkbox changes.
          needle='  // A separate HTTP client writes a real source through the live Next.js service.'
          if needle in body:
              body=body.replace(needle,needle)
          p.write_text(body)
          PY
      - run: npm ci --no-audit
      - run: npm exec --yes --package=prettier@3.6.2 -- prettier --write src/components/agent-console.tsx scripts/test-browser.mjs playwright.config.ts tests/e2e/setup.ts package.json
      - run: npm run typecheck
      - name: Commit source and test corrections
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/agent-console.tsx scripts/test-browser.mjs playwright.config.ts tests/e2e/setup.ts package.json
          test -z "$(git diff --cached --name-only -- .github)"
          git commit -m 'fix: align permission presets and isolate browser acceptance workspaces'
          git push origin HEAD:feat/agent-gateway-v1-1
