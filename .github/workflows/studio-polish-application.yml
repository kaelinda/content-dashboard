name: Apply Studio application corrections
on:
  push:
    branches: ['feat/studio-ui-v1-2']
    paths: ['.github/workflows/studio-polish-application.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-ui-v1-2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply exact reviewed application patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,textwrap
          b=Path('.github/workflows/studio-polish.yml').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='32a2f5a9bb23523e337fc3ba068fb1f6a5e13f1f'
          script=b.decode().split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(script),'reviewed-studio-correction','exec'))
          PY
      - run: npm ci --no-audit
      - run: npx --yes prettier@3.6.2 --write src/app/studio.css src/components/source-explorer.tsx tests/e2e/studio.spec.ts
      - run: npm run typecheck
      - name: Commit application files only
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/studio.css src/components/source-explorer.tsx tests/e2e/studio.spec.ts
          git commit -m 'fix: readable Studio text, fitting mobile tables and accessible capture actions'
          git push origin HEAD:feat/studio-ui-v1-2
