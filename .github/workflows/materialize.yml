name: Materialize verified Content Hub
on:
  push:
    branches: ['build/content-hub-v1']
    paths: ['.github/workflows/materialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/content-hub-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and expand source
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          parts = sorted(pathlib.Path('.bootstrap').glob('part-*.b64'))
          assert len(parts) == 7
          encoded = b''.join(p.read_bytes() for p in parts)
          # Repair one identified transfer typo; archive checksum is authoritative.
          encoded = encoded.replace(b'bLKJqt', b'bLKqt')
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == '6dcb8f62c17b8afac06f81a087c2b2ca15e354d770349d5f79d574842c2523c3'
          pathlib.Path('/tmp/content-hub.tar.xz').write_bytes(data)
          PY
          tar -xJf /tmp/content-hub.tar.xz
          rm -rf .bootstrap
          rm -f .github/workflows/materialize.yml .github/workflows/runtime-cache.yml
      - name: Resolve and lock dependencies
        run: npm install --no-audit
      - name: Format source for maintenance
        run: npm exec --yes --package=prettier@3.6.2 -- prettier --write 'src/**/*.{ts,tsx,css}' 'scripts/*.{ts,mjs}' 'tests/**/*.ts' '*.{json,ts,md,yaml}' 'docs/*.md' '.github/workflows/*.yml'
      - name: Commit readable application source
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deliver private content workspace with versioned assets and MCP'
          git push origin HEAD:build/content-hub-v1
          git rev-parse HEAD
      - name: Package source
        run: git archive --format=zip --prefix=content-dashboard/ -o /tmp/content-dashboard-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: content-hub-source
          path: /tmp/content-dashboard-source.zip
          retention-days: 14
