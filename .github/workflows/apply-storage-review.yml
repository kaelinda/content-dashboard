name: Apply bounded storage review
on:
  push:
    branches: ['fix/operations-hardening-v1-2-1']
    paths: ['.github/workflows/apply-storage-review.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operations-hardening-v1-2-1
      - name: Apply digest-verified review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1abe6fb072acdd2aa48a1460cdd6ba7223537bad202ef63d59c96f8c47ae78c7'
          path = Path('/tmp/storage-review.patch')
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)], check=True)
          subprocess.run(['git','apply','--index',str(path)], check=True)
          expected = {'src/lib/storage-inspection.ts','tests/operations.test.ts','docs/OPERATIONS_HARDENING.md'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed == expected
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit reviewed application changes only
        run: |
          git config user.name 'Content Hub Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bound blob body reads and report interrupted inventories'
          git push origin HEAD:fix/operations-hardening-v1-2-1
